<div
  aria-label="Фільтр за статусом"
  class="inline-flex items-center p-0.5 bg-[#E9EDF2] border border-[#D7DCE2] rounded-lg text-xs font-medium gap-0.5"
  role="group"
>
  @for (option of options; track option.value) {
    <button
      (click)="onSelect(option.value)"
      [class]="
        isActive(option.value)
          ? 'bg-white text-[#20262E] shadow-xs font-semibold'
          : 'text-[#475467] hover:text-[#20262E] hover:bg-[#D7DCE2]/60'
      "
      class="px-2.5 py-1 rounded-md transition-all cursor-pointer whitespace-nowrap"
      type="button"
    >
      {{ option.label }}
    </button>
  }
</div>
